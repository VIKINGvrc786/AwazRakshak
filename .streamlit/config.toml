[server]
address = "127.0.0.1"
headless = true
maxUploadSize = 50

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#b53a32"
backgroundColor = "#101214"
secondaryBackgroundColor = "#191c20"
textColor = "#e8eaed"
borderColor = "#34383f"
codeBackgroundColor = "#1d2024"
showWidgetBorder = true
showSidebarBorder = false
font = "sans serif"
headingFont = "sans serif"
codeFont = "monospace"
paddingTop = "1.5rem"
paddingBottom = "1.5rem"
