[server]
address = "127.0.0.1"
headless = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#4F8F94"
backgroundColor = "#F4F8F8"
secondaryBackgroundColor = "#E3EEEE"
textColor = "#24383B"
borderColor = "#C9DCDC"
codeBackgroundColor = "#E3EEEE"
showWidgetBorder = true
showSidebarBorder = true
font = "sans serif"
